<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Unqualified Critique</title>
<style id="app-css">
/* Layout: sticky marquee header, marquee-light hero with ticket stubs, poster/sleeve grid of reviews, quiet bands below */
:root{
  --bg:#F1F2F5;--surface:#FFFFFF;--surface2:#E6E8EE;--text:#16171D;--muted:#5A5D6C;--line:#D6D9E1;--film:#A85F00;--music:#5B50D6;--on-film:#FFFFFF;--on-music:#FFFFFF;
  --f-display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--dw:900;--up:uppercase;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;--wrap:1180px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101116;--surface:#181A22;--surface2:#22252F;--text:#ECEBE6;--muted:#9A9CA8;--line:#2B2E3A;--film:#F0A646;--music:#978FFA;--on-film:#16171D;--on-music:#16171D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101116;--surface:#181A22;--surface2:#22252F;--text:#ECEBE6;--muted:#9A9CA8;--line:#2B2E3A;--film:#F0A646;--music:#978FFA;--on-film:#16171D;--on-music:#16171D;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--text);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--film);outline-offset:2px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.disp,h1,h2,h3{font-family:var(--f-display);font-weight:var(--dw);text-transform:var(--up);letter-spacing:.005em;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}
.kicker{font:600 12px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.k-film{--kc:var(--film);--kon:var(--on-film)}
.k-music{--kc:var(--music);--kon:var(--on-music)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:var(--r);font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--film);color:var(--on-film)}
.btn.solid:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{min-height:34px;padding:0 14px;font-size:14px}
.play{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:24px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo-mark{display:grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:var(--r);background:var(--text);color:var(--bg);font:800 13px/1 var(--f-mono);letter-spacing:.04em}
.logo-img{height:34px;width:auto;max-width:120px;border-radius:calc(var(--r)/2)}
.brand-name{font-family:var(--f-display);font-weight:var(--dw);text-transform:var(--up);font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:20px;margin-left:auto}
.nav a{white-space:nowrap;text-decoration:none;font-size:14px;font-weight:600;color:var(--muted)}
.nav a:hover{color:var(--text)}
.top-act{display:flex;gap:8px;margin-left:auto}
.nav+.top-act{margin-left:0}
@media (max-width:980px){.nav{display:none}.top-act{margin-left:auto}}
body.ed-open .nav{display:none}body.ed-open .top-act{margin-left:auto}
@media (max-width:560px){.grid:not(.list){grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card-title{font-size:21px}.card-body{padding:12px}.card-foot{padding:0 12px 10px}.card-verdict{display:none}.c-title{font-size:20px}}
@media (max-width:460px){.brand-name{display:none}}
@media (max-width:560px){.top-in{gap:10px}.brand{flex:0 1 auto;min-width:0}.logo-img{max-width:38vw!important;height:auto!important;max-height:40px;object-fit:contain}.top-act{flex:none;gap:6px}.top-act .btn.sm{padding:0 10px;font-size:13px}}
@media (max-width:720px){html .feat.feat{grid-template-columns:minmax(0,1fr)!important}html .feat.feat .cover{max-width:280px}}

/* hero */
.hero{padding-block:clamp(40px,8vw,96px) clamp(32px,5vw,64px)}
.bulbs{height:10px;width:min(100%,420px);margin-bottom:18px;background:radial-gradient(circle,var(--film) 2.6px,transparent 3.2px) 0 50%/16px 10px repeat-x;animation:chase 1.1s steps(2) infinite;opacity:.9}
@keyframes chase{to{background-position:16px 50%}}
.hero h1{font-size:clamp(46px,10.5vw,150px);line-height:.88;margin:.12em 0 .18em;overflow-wrap:anywhere}
.tagline{font-size:clamp(18px,2.2vw,23px);line-height:1.45;max-width:42ch;color:var(--muted);margin:0}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-stats{margin-top:22px;font:500 13px/1.5 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stubs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;margin-top:40px}
.stub{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:16px 22px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;cursor:pointer;transition:transform .15s ease,border-color .15s ease}
.stub:hover{transform:translateY(-2px);border-color:var(--kc)}
.stub::before,.stub::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.stub::before{left:-10px}.stub::after{right:-10px}
.stub .lab{writing-mode:vertical-rl;transform:rotate(180deg);font:700 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--kc);padding-left:14px;border-left:2px dashed var(--line);align-self:stretch;text-align:center}
.stub .st-title{display:block;font-family:var(--f-display);font-weight:var(--dw);text-transform:var(--up);font-size:26px;line-height:1}
.stub .st-by{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.stub-body{min-width:0}
.stub.has-art{--art:clamp(88px,10vw,120px);grid-template-columns:var(--art) auto minmax(0,1fr) auto;padding:18px 22px 18px 14px}
.stub.has-art>.mini-poster,.stub.has-art>.vinyl{justify-self:center}
.mini-poster{--ph:clamp(100px,11vw,132px);position:relative;display:block;height:var(--ph);width:calc(var(--ph) * 2 / 3);max-width:100%;border-radius:2px;overflow:hidden;background:#111;box-shadow:0 8px 18px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);transform:rotate(-2.5deg);transition:transform .2s ease}
.stub:hover .mini-poster{transform:rotate(0deg) scale(1.04)}
.mini-poster img{width:100%;height:100%;object-fit:cover;display:block}
.mini-poster::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 38%)}
.mp-gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;padding:8px 7px;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.45)),var(--c);color:var(--cf)}
.mp-title{font-family:var(--f-display);font-weight:var(--dw);text-transform:var(--up);font-size:calc(var(--ph) * .13);line-height:.92;overflow-wrap:anywhere}
.mp-by{font:600 calc(var(--ph) * .045) var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.mp-gen::after{content:"";height:5px;margin-top:3px;background:repeating-linear-gradient(90deg,currentColor 0 2px,transparent 2px 3px);opacity:.35}
.vinyl{--vs:clamp(88px,10vw,120px);position:relative;display:block;width:var(--vs);height:var(--vs);border-radius:50%;flex:none;font-size:calc(var(--vs) * .1);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.vinyl-disc{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#18181b 0 .7px,#0b0b0d .7px 2.4px)}
.vinyl-disc::before{content:"";position:absolute;inset:21%;border-radius:50%;background:#09090b;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.v-label{position:absolute;inset:24.5%;border-radius:50%;background:var(--lb);color:var(--li);display:grid;grid-template-rows:1fr 16% 1fr;justify-items:center;text-align:center;overflow:hidden;padding:0 9%}
.v-label.ring{box-shadow:inset 0 0 0 calc(var(--vs) * .018) var(--lb),inset 0 0 0 calc(var(--vs) * .026) var(--li)}
.v-top{grid-row:1;align-self:end;display:flex;flex-direction:column;align-items:center;width:100%;padding-bottom:5%}
.v-title{display:block;width:100%;height:auto;overflow:visible}
.v-title text{font-family:var(--lf),var(--f-display);font-size:26px;fill:var(--li)}
.v-title.outline text{fill:none;stroke:var(--li);stroke-width:1.1px;stroke-linejoin:round}
.v-artist{max-width:80%;font:800 .34em/1.1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3%;overflow-wrap:anywhere}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(from 20deg,transparent 0 6%,rgba(255,255,255,.13) 11%,transparent 17% 50%,rgba(255,255,255,.13) 61%,transparent 67%)}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:6%;height:6%;transform:translate(-50%,-50%);border-radius:50%;z-index:2;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.vinyl-disc{animation:vspin 1.8s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}
.hero.split .hero-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center}
.hero.split h1{font-size:clamp(48px,8vw,120px)}
.hero.split .cover{max-width:380px;margin-left:auto;width:100%}
@media (max-width:760px){.hero.split .hero-grid{grid-template-columns:1fr}.hero.split .cover{margin-left:0;max-width:300px}}
.hero.minimal{padding-block:clamp(32px,5vw,56px) 8px}
.hero.minimal h1{font-size:clamp(40px,6vw,72px)}

/* sections */
.sec{padding-block:clamp(40px,6vw,72px);border-top:1px solid var(--line)}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:24px}
.sec-head h2{font-size:clamp(34px,5vw,56px);line-height:.95}
.count{font:500 13px var(--f-mono);color:var(--muted);margin:0;font-variant-numeric:tabular-nums}

/* covers */
.cover{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--surface2);display:block}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.gen.film{background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.38)),var(--c);color:var(--cf);display:flex;flex-direction:column;justify-content:space-between;padding:18px 18px 16px 30px}
.cover.gen.film::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.34) 0 8px,transparent 8px 16px)}
.c-top{font:600 10px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85;position:relative}
.c-title{font-family:var(--f-display);font-weight:var(--dw);text-transform:var(--up);font-size:clamp(24px,3vw,34px);line-height:.92;overflow-wrap:anywhere;position:relative}
.c-year{font:600 11px var(--f-mono);letter-spacing:.1em;border-top:1px solid currentColor;padding-top:6px;opacity:.85;position:relative}
.cover.gen.music{background:var(--surface2)}
.disc{position:absolute;top:14%;right:3%;width:66%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--c) 0 15%,#0d0d0f 15.5% 17%,transparent 17.5%),repeating-radial-gradient(circle,#121215 0 2px,#1e1e22 2px 4px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.sleeve{position:absolute;inset:10% 26% 10% 7%;background:var(--c);color:var(--cf);display:flex;flex-direction:column;justify-content:space-between;padding:14px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.sleeve .c-title{font-size:clamp(20px,2.4vw,28px)}

/* score */
.score{display:inline-flex;align-items:baseline;gap:2px;font-variant-numeric:tabular-nums;line-height:1;flex-wrap:wrap}
.score b{font-family:var(--f-display);font-weight:var(--dw);font-size:34px;color:var(--kc,var(--text))}
.score small{font:600 12px var(--f-mono);color:var(--muted)}
.score.lg b{font-size:clamp(64px,9vw,96px)}
.score.lg small{font-size:15px}
.stars{position:relative;display:block;flex-basis:100%;font-size:13px;letter-spacing:2px;color:var(--line);margin-top:4px}
.stars::before{content:"★★★★★"}
.stars::after{content:"★★★★★";position:absolute;left:0;top:0;width:var(--p);overflow:hidden;white-space:nowrap;color:var(--kc,var(--film))}
.score.lg .stars{font-size:20px}
.meter{display:block;height:3px;background:var(--surface2)}
.meter i{display:block;height:100%;background:var(--kc)}

/* review tools & grid */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tools input,.tools select{height:36px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--r);padding:0 12px;font:inherit;font-size:14px}
.tools input{flex:1 1 220px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:clamp(14px,2vw,24px)}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;cursor:pointer;transition:transform .15s ease,border-color .15s ease}
.card:hover{transform:translateY(-3px);border-color:var(--kc)}
.card-body{display:flex;flex-direction:column;gap:4px;padding:14px 16px 12px;flex:1;min-width:0}
.kind{font:700 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--kc)}
.sample{font-style:normal;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:6px;letter-spacing:.06em}
.card-title{font-family:var(--f-display);font-weight:var(--dw);text-transform:var(--up);font-size:26px;line-height:1;margin-top:2px;overflow-wrap:anywhere}
.card-by{font-size:14px;color:var(--muted)}
.card-meta{font:500 12px var(--f-mono);color:var(--muted)}
.card-verdict{font-size:14px;line-height:1.45;margin-top:6px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 12px}
.vid-flag{font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.grid.list{grid-template-columns:1fr;gap:10px}
.grid.list .card{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center}
.grid.list .cover{height:90px;aspect-ratio:auto}
.grid.list .cover.gen .c-top,.grid.list .cover.gen .c-year,.grid.list .cover .c-title{display:none}
.grid.list .card-verdict{display:none}
.grid.list .card-foot{padding:0 16px}
.grid.list .meter{display:none}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* featured */
.feat{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:clamp(24px,5vw,56px);align-items:start}
.feat .cover{border-radius:var(--r)}
.feat h3{font-size:clamp(40px,6vw,76px);line-height:.9;margin:8px 0 6px;overflow-wrap:anywhere}
.feat .by{color:var(--muted);margin:0 0 18px}
.feat .verdict{font-size:clamp(19px,2.2vw,24px);line-height:1.4;max-width:34ch;margin:18px 0}
.feat .body{max-width:62ch;color:var(--muted)}
.feat .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.feat.k-film:has(>.cover:not(.gen)){grid-template-columns:minmax(0,284px) minmax(0,1fr)}
.feat.k-film>.cover:not(.gen){aspect-ratio:auto}
.feat.k-film>.cover:not(.gen) img{height:auto}
@media (max-width:720px){.feat{grid-template-columns:1fr}.feat .cover{max-width:280px}}

/* queue */
.queue{display:grid;gap:0;border-top:1px solid var(--line)}
.q-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.q-title{font-family:var(--f-display);font-weight:var(--dw);text-transform:var(--up);font-size:24px;line-height:1.05}
.q-note{color:var(--muted);font-size:14px;display:block;margin-top:2px}
.q-when{font:600 12px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.q-row{grid-template-columns:1fr auto}.q-row .kind{grid-column:1/-1}}

/* scale */
.scale{display:grid;gap:0;border-top:1px solid var(--line);max-width:860px}
.sc-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--line);align-items:baseline}
.sc-range{font-family:var(--f-display);font-weight:var(--dw);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.sc-label{font-weight:700}
.sc-desc{color:var(--muted);display:block}
@media (max-width:520px){.sc-row{grid-template-columns:1fr;gap:4px}}

/* about */
.about{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start}
.avatar{width:clamp(96px,14vw,150px);aspect-ratio:1;border-radius:50%;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font:800 34px var(--f-mono);color:var(--muted)}
.about .txt{max-width:62ch}
.about .txt p{margin:0 0 1em}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
@media (max-width:560px){.about{grid-template-columns:1fr}}

/* subscribe band */
.band{background:var(--film);color:var(--on-film);padding-block:clamp(40px,6vw,72px)}
.band-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px}
.band h2{font-size:clamp(36px,6vw,72px);line-height:.9;max-width:16ch}
.band p{margin:10px 0 0;max-width:48ch;opacity:.9}
.band .btn{background:var(--on-film);color:var(--film)}

/* footer */
.foot{padding-block:32px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center}
.foot a{color:var(--muted)}
.foot nav{display:flex;flex-wrap:wrap;gap:16px}

/* review overlay */
.ov{position:fixed;inset:0;z-index:40;background:rgba(6,7,10,.66);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.ov-panel{position:relative;width:min(900px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);color:var(--text);border-radius:calc(var(--r) + 4px);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr)}
.ov-panel .cover{height:100%;min-height:360px;aspect-ratio:auto}
.ov-body{padding:28px clamp(18px,3vw,36px) 32px;min-width:0}
.ov-body h3{font-size:clamp(36px,5vw,60px);line-height:.92;margin:8px 0 6px;overflow-wrap:anywhere}
.ov-body .by{color:var(--muted);margin:0}
.ov-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 12px var(--f-mono);color:var(--muted);margin:14px 0 18px;font-variant-numeric:tabular-nums}
.ov-body .verdict{font-size:20px;line-height:1.4;margin:16px 0}
.ov-body .body p{margin:0 0 1em;color:var(--muted)}

/* editor (fixed tool palette, independent of the site's theme) */
.ed{--e-bg:#15161B;--e-fld:#1F2128;--e-line:#32353F;--e-text:#E9EAEE;--e-muted:#9A9DAA;--e-acc:#8FB3FF;--e-ok:#7BD88F;--e-warn:#F5B96B;color-scheme:dark;position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(440px,100%);background:var(--e-bg);color:var(--e-text);border-left:1px solid var(--e-line);display:flex;flex-direction:column;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:-12px 0 40px rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ed-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--e-line)}
.ed-head strong{font-size:16px}

.ed-tabs{display:flex;gap:2px;overflow-x:auto;padding:8px 10px 0;border-bottom:1px solid var(--e-line);scrollbar-width:none}
.ed-tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--e-muted);padding:8px 10px;cursor:pointer;font-weight:600;white-space:nowrap}

.ed-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.ed h4{margin:8px 0 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--e-muted)}
.ed .hint{color:var(--e-muted);font-size:13px;margin:0}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:13px;color:var(--e-muted);font-weight:600}
.ed input[type=text],.ed input[type=url],.ed input[type=number],.ed input[type=date],.ed select,.ed textarea{width:100%;background:var(--e-fld);color:var(--e-text);border:1px solid var(--e-line);border-radius:6px;padding:8px 10px;font:inherit}

2016","meta":"128 min","genre":"Musical","score":10,"verdict":"This film destroyed me.","body":"La La Land is cinema at its absolute finest. It is probably the most beautiful film ever to touch the big screen. Full of vibrant colors which are not only artistic, but symbolic as well. As a musical, it is well choreographed, and the songs slide nicely into the story. The jazz is beautiful. \nMia and Sebastian's love story is so beautiful and hilarious. Sebastian supports Mia, empowering her to make her dream a reality, but in the end, when both their dreams have come true, was it worth it?\nWhen Sebastian plays that first note of “Mia and Sebastian’s Theme” it’s over. One of if not the saddest moments in cinema.\nRyan Gosling plays Sebastian with such commitment, confidence and emotion. He is perfect for the role, and makes the film so much better. Emma Stone’s performance is amazing as well: slightly quirky, strong face acting, she plays Mia very well. \nChazelle’s ability to depict feeling  through color and music makes the film so much deeper emotionally. Recurring ideas and themes make the film into one super cohesive narrative, which tells a beautiful story.","video":"","date":"2026-09-29","cover":{"color":"#2A2470","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAKFAbADASIAAhEBAxEB/8QAHQAAAgIDAQEBAAAAAAAAAAAAAAIBAwQFBgcICf/EAFYQAAEEAQMCBAMDBwYJCQcDBQEAAgMRBAUSIQYxE0FRYQcicRSBkQgVIzJCobFigrPB0fAWMzdScnR1kuEXJCYnNkNTsvE0NURWlLTCJXOjVFVlg6L/xAAbAQEBAAMBAQEAAAAAAAAAAAAAAQIDBAUGB//EADYRAAICAQMDAgQEBQIHAAAAAAABAhEDBBIhBRMxQVEUIjJhBjRxgSMkM0KxodEHFVKRweHw/9oADAMBAAIRAxEAPwD5fQhC+jNAKwxM+ziXx2eIXlpio7gK/Wuqry73wq0IAQhWw4/jRTyeLEzwWh217qc+3AU0eZ5v6AqAqQhCAEIQgBCEIAQhCAEIQgBCEIAQhCoBCEKAEK3JEAmcMZ0r4uNrpGhrjxzYBPn7qpUAhWSeD4UfhmQyUfEDgABzxXPPCrQAhCukw8iLEiy3xkQTOcyN/k4trcPu3D8V art to an epic story and provided fuel for live shows as well.\nThe tracks which are not part of the narrative are phenomenal as well. They struggle with identity, fame, and Tyler's songwriting process. The best song on this record may be Neon Gravestones which deals with the dark nature of how suicide is often used as a weapon or power grab. \nMusically, this is also TOP's best album, the synth lines are peak, complex, and diverse. Josh Dunn's drum lines are absolute fire. Each track is very melodically and rhythmically different. From rap, to pop, to rock, to reggae, TOP really experiment with everything here. \nThis record deserves the Grammy it earned as much as anyone can.  ","video":"","date":"2026-09-29","cover":{"color":"#3A381B","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAOAA4QDASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAAAwECBAUABgcICf/EAFAQAAIBAgQEAwYEBQMDAgMAEwECAwQRABIhMQUTQVEGImEHFDJxgZEjobHwQlLB0eEIFfEkM2IWchdDgqIlU2OSJjREVdIYZCc3RWVzsrP/xAAcAQEAAwEBAQEBAAAAAAAAAAAAAQIDBAUGBwj/xABGEQACAQIEBAIIBQEFBwMEAwAAAQIDEQQSITEFQVHwYXEGEyKBkaGxwRQy0eHxQhUjM1JyBzRDYqKy0iQ1kiVTgsKz0+P/2gAMAwEAAhEDEQA/APK1JWLT01RTikFQJBZF1tEbjzCx38pFjcWa+9iHyfiO0zU/mAUqfiG3Rug66HrhtO7RyhpWcuWAuygKCABb7EYWVzMFdnkURLbIraKFOm24t39MAPklqCyI3KChQT0Y7an/AD6baWfLNTskVPkyKyALYaAa633Ovz3wCGRZZJLFXlIsuZSL6AAj+vyxlySWqSrxoRYjMpGm3y+X9TgB8tmfmrqirZne4YAdvTXBHqGaMplkEqj/ALpjs1r3Av2wqGNpQ0IblbeVj22IOp64Yp8sScwOA2eysAB6nvYWwBkqOY1SVnUnzMSQ3lHrbTvfDoy7RsxK2NhdQCVPqf8AjCzw5ZFlaRgLK7RMtyPTf64aIXDg81JUbMx8uuv8I+WAJNPUxLDLCI0JACcxza533G+IsjyLKhMoeVyFUgaAHa3r64Dy1ljBUPmF0UliMp7EEYVnHIEQ0QWaRlUkkehGxxFgEmuFMMgkDE2c2bQ9Nv0OBNzGjYjJH5ciMguTY7XO2DPOoIIcjOp0zGyr013JxEFVkiHOta9rOmYE99N8SB5miaUZJnlU3uZAFyH5AWucI7upsbHTVQDcC+hG++FVmkmSNZo4ZHN/Kbg29Pl3wtUVDs0ZswGzHT6W0wBnBakR8UpwwiVRIAbLY210wbj1bDU8XmyEMSQ2ci9tNRf99M /* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\/[^\s"<>]+$/i.test(u)?u:'';}
function safeColor(c,d){return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c||'')?c:(d||'#444444');}
function safeImg(u){return /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(u||'')?u:'';}
function clone(o){return JSON.parse(JSON.stringify(o));}
function hexRgb(h){h=safeColor(h).slice(1);if(h.length===3)h=h.replace(/./g,'$&$&');var n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function lum(h){var c=hexRgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function onColor(h){return lum(h)>.36?'#141418':'#FFFFFF';}
function fmtN(n){n=Number(n)||0;return Number.isInteger(n)?String(n):n.toFixed(1);}
function initials(n){return String(n||'?').split(/[\s&]+/).filter(Boolean).slice(0,3).map(function(w){return w[0];}).join('').toUpperCase();}
function paras(t){return String(t||'').split(/\n\s*\n/).map(function(p){return p.trim();}).filter(Boolean).map(function(p){return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>';}).join('');}
function fmtDate(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return '';var x=new Date(d+'T12:00:00');return isNaN(x)?'':x.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}
function newId(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function getPath(o,p){return p.split('.').reduce(function(a,k){return a==null?undefined:a[k];},o);}
function setPath(o,p,v){var ks=p.split('.');var last=ks.pop();var t=ks.reduce(function(a,k){if(a[k]==null||typeof a[k]!=='object')a[k]={};return a[k];},o);t[last]=v;}

function normalize(s){
  s=s&&typeof s==='object'?s:{};

  s.channel=Object.assign({url:'',subscribeLabel:'Subscribe'},s.channel);
  s.look=Object.assign({preset:'booth',mode:'auto',display:'Big Shoulders Display',body:'Figtree',mono:'JetBrains Mono',upper:true,bulbs:true,heroStyle:'marquee',cardStyle:'grid',radius:6,overrides:{},customCss:''},s.look);
  s.look.overrides=Object.assign({light:{},dark:{}},s.look.overrides);
  s.scoring=Object.assign({scale:'10',filmLabel:'Film',musicLabel:'Album',rows:[]},s.scoring);
  if(!Array.isArray(s.scoring.rows))s.scoring.rows=[];
  var secs=Array.isArray(s.sections)?s.sections.filter(function(x){return x&&SECTION_NAMES[x.id];}):[];
  Object.keys(SECTION_NAMES).forEach(function(id){if(!secs.some(function(x){return x.id===id;}))secs.push({id:id,on:false,title:SECTION_NAMES[id]});});
  s.sections=secs;
  s.about=Object.assign({heading:'About',body:''},s.about);
  s.cta=Object.assign({heading:'Subscribe',body:''},s.cta);
  s.footer=s.footer||'';
  s.links=Array.isArray(s.links)?s.links:[];
  s.queue=Array.isArray(s.queue)?s.queue:[];
  s.reviews=Array.isArray(s.reviews)?s.reviews:[];
  s.reviews.forEach(function(r){r.id=r.id||newId();r.kind=r.kind==='music'?'music':'film';r.score=Math.max(0,Math.min(10,Number(r.score)||0));r.cover=Object.assign({color:'#444444',img:''},r.cover);});
  return s;
}

var ART=null, EDIT=false, CAN_SAVE=false, LOCAL=(location.protocol==='file:');
function initCaps(){
  if(!window.claude||typeof window.claude.use!=='function'){
    if(LOCAL&&!EDIT){EDIT=true;render();}
    return false;
  }
  Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(res){
    ART=res[0];var user=res[1];
    if(!ART)return;
    var p=user&&user.canEdit?user.canEdit():Promise.resolve(false);
    return Promise.resolve(p).then(function(ok){if(ok){EDIT=true;CAN_SAVE=true;render();}});
  }).catch(function(){});

/* ---------- scoring ---------- */
var LETTERS=[[9.7,'A+'],[9.2,'A'],[8.8,'A−'],[8.4,'B+'],[7.8,'B'],[7.3,'B−'],[6.8,'C+'],[6.2,'C'],[5.7,'C−'],[5,'D+'],[4.3,'D'],[3.5,'D−'],[0,'F']];

    return '<div class="item"><div class="two">'+f_text('From (0–10)',p+'min',{type:'number',step:'0.5',min:0,max:10})+f_text('To (0–10)',p+'max',{type:'number',step:'0.5',min:0,max:10})+'</div>'+f_text('Label',p+'label')+f_text('Meaning',p+'desc')+'<div class="row-btns"><button type="button" class="eb danger" data-act="sc-del" data-i="'+i+'">Remove row</button></div></div>';}).join('')+
   '<button type="button" class="eb pri" data-act="sc-add">+ Add row</button>';
}
function tabLinks(){
  return '<p class="hint">Shown in the About section and footer. Links without an address stay hidden.</p>'+S.links.map(function(l,i){var p='links.'+i+'.';
   return '<div class="item"><div class="two">'+f_text('Label',p+'label')+f_text('Link',p+'url',{type:'url',ph:'https://'})+'</div><div class="row-btns"><button type="button" class="ib" data-act="ln-up" data-i="'+i+'" aria-label="Move up"'+(i===0?' disabled':'')+'>↑</button><button type="button" class="eb danger" data-act="ln-del" data-i="'+i+'">Remove</button></div></div>';}).join('')+
   '<button type="button" class="eb pri" data-act="ln-add">+ Add link</button>';
}
function tabBackup(){
  return '<p class="hint">Copy everything on the site (text, settings, reviews and images) as one block of data. Paste it back here to restore it.</p><div class="row-btns"><button type="button" class="eb pri" data-act="copy">Copy site data</button></div>'+
   '<label class="fld"><span>Paste site data to import</span><textarea id="imp" class="code" spellcheck="false"></textarea></label><div class="row-btns"><button type="button" class="eb'+(armed==='import'?' danger armed':'')+'" data-act="import">'+(armed==='import'?'Click again to replace the site':'Import')+'</button></div>';
}
var TAB_FN={brand:tabBrand,look:tabLook,sections:tabSections,reviews:tabReviews,queue:tabQueue,scoring:tabScoring,links:tabLinks,backup:tabBackup};

function draftBanner(){
  var d=readDraft();if(!d||d===PUBLISHED||d===JSON.stringify(S))return '';
  return '<div class="banner"><span>You have unpublished changes saved in this browser from an earlier session.</span><div class="row-btns"><button type="button" class="eb pri" data-act="draft-restore">Restore them</button><button type="button" class="eb" data-act="draft-drop">Discard</button></div></div>';
}
function renderEditor(){
  if(!edOpen){edRoot.innerHTML='';return;}
  var scroll=(edRoot.querySelector('.ed-body')||{}).scrollTop||0;
  edRoot.innerHTML='<aside class="ed" aria-label="Customize site"><div class="ed-head"><strong>Customize</strong><button type="button" class="ed-x" data-act="close">Close</button></div>'+
   '<div class="ed-tabs" role="tablist">'+TABS.map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(edTab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>'+
   '<div class="ed-body">'+draftBanner()+TAB_FN[edTab]()+'</div>'+
   '<div class="ed-foot"><p class="ed-status '+statusMsg.k+'" role="status">'+esc(statusMsg.t)+'</p><div class="acts"><span class="dirty" id="dirty"></span><button type="button" class="eb'+(armed==='discard'?' danger armed':'')+'" data-act="discard">'+(armed==='discard'?'Click again to discard':'Discard changes')+'</button><button type="button" class="eb pri" data-act="publish">Publish changes</button></div></div></aside>';
  edRoot.querySelector('.ed-body').scrollTop=scroll;
  updateFoot();
}
function updateFoot(){
  var d=document.getElementById('dirty');if(d)d.textContent=isDirty()?'Unpublished changes':'';
  var pb=edRoot.querySelector('[data-act="publish"]'),db=edRoot.querySelector('[data-act="discard"]');
  if(pb)pb.disabled=!isDirty();if(db)db.disabled=!isDirty();
}
function setStatus(t,k){statusMsg={t:t,k:k||''};var el=edRoot.querySelector('.ed-status');if(el){el.textContent=t;el.className='ed-status '+(k||'');}}
function openEditor(){edOpen=true;document.body.classList.add('ed-open');if(!CAN_SAVE&&!statusMsg.t)setStatus(LOCAL?'Preview: changes show live here, but publishing only works on the published page.':'Changes show live. Publishing needs edit access to this page.','warn');renderEditor();}
function openEditorAt(id){
  if(!ov.hidden)closeReview();
  edTab='reviews';edFocus=id;edRev=id;armed=null;openEditor();
  var b=edRoot.querySelector('.ed-body');if(b)b.scrollTop=0;
  var t=edRoot.querySelector('[data-bind$=".title"]');if(t)t.focus();
}
function closeEditor(){edOpen=false;document.body.classList.remove('ed-open');renderEditor();var b=document.getElementById('open-editor');if(b)b.focus();}

function coerce(el){
  if(el.type==='checkbox')return el.checked;
  if(el.type==='range'||el.type==='number'){var n=parseFloat(el.value);return isNaN(n)?0:n;}
  return el.value;
}
edRoot.addEventListener('input',function(e){
  var el=e.target,p=el.dataset.bind;if(!p||el.tagName==='SELECT')return;
  setPath(S,p,coerce(el));
  if(/^reviews\.\d+\.(title|kind)$/.test(p)||/^reviews\.\d+\./.test(p)){var m=p.match(/^reviews\.(\d+)\.(.+)$/);if(m){var r=S.reviews[+m[1]];if(r&&m[2]!=='sample'&&r.sample){r.sample=false;}if(m[2]==='score'){var o=document.getElementById('sc-'+m[1]);if(o)o.textContent=scoreVal(r.score)+scoreSuf();}if(m[2]==='title'){var t=el.closest('.item').querySelector('.t');if(t)t.textContent=el.value||'Untitled';}}}
  if(p==='look.radius'){var rv=document.getElementById('rad-v');if(rv)rv.textContent=el.value+'px';}
  changed();
});
edRoot.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.bind&&(el.tagName==='SELECT'||el.type==='checkbox')){
    setPath(S,el.dataset.bind,coerce(el));
    if(/^reviews\.\d+\.featured$/.test(el.dataset.bind)&&el.checked){var i=+el.dataset.bind.split('.')[1];S.reviews.forEach(function(r,j){if(j!==i)r.featured=false;});}
    changed();if(el.dataset.re)renderEditor();return;
  }
  if(el.dataset.img&&el.files&&el.files[0]){
    var file=el.files[0],max=+el.dataset.max||800,path=el.dataset.img;
    if(file.size>15*1024*1024){setStatus('That image is over 15 MB. Choose a smaller file.','warn');return;}
    readImg(file,max,function(url){setPath(S,path,url);var m=path.match(/^reviews\.(\d+)\./);if(m&&S.reviews[+m[1]])S.reviews[+m[1]].sample=false;changed();renderEditor();setStatus('Image added.','ok');});
  }
});
function readImg(file,max,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){
    var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    var keepPng=file.type==='image/png'&&max<=400;cb(c.toDataURL(keepPng?'image/png':'image/jpeg',.84));
  };im.onerror=function(){setStatus('That file could not be read as an image. Try a JPG or PNG.','warn');};im.src=fr.result;};
  fr.onerror=function(){setStatus('That file could not be read. Try another one.','warn');};
  fr.readAsDataURL(file);
}
function move(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;}
edRoot.addEventListener('click',function(e){
  var tb=e.target.closest('[data-tab]');if(tb){edTab=tb.dataset.tab;armed=null;edFocus=null;renderEditor();edRoot.querySelector('.ed-body').scrollTop=0;return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,i=+b.dataset.i,re=true,wasArmed=armed;armed=null;
  switch(a){
    case 'close':closeEditor();return;
    case 'preset':S.look.preset=b.dataset.k;S.look.overrides={light:{},dark:{}};break;
    case 'pal':edPal=b.dataset.v;changed();renderEditor();return;
    case 'reset-colors':S.look.overrides={light:{},dark:{}};break;
    case 'img-clear':setPath(S,b.dataset.path,'');break;
    case 'sec-up':move(S.sections,i,-1);break;
    case 'sec-down':move(S.sections,i,1);break;
    case 'rev-add':var r={id:newId(),kind:b.dataset.k,title:'',creator:'',year:String(new Date().getFullYear()),meta:'',genre:'',score:7,verdict:'',body:'',video:'',date:new Date().toISOString().slice(0,10),cover:{color:b.dataset.k==='music'?'#3A3F8F':'#5C2E2E',img:''},featured:false,sample:false};S.reviews.unshift(r);edRev=r.id;edFocus=r.id;break;
    case 'rev-edit':edFocus=b.dataset.id;edRev=b.dataset.id;break;
    case 'rev-all':edFocus=null;edRev=null;break;
    case 'rev-up':move(S.reviews,i,-1);break;
    case 'rev-down':move(S.reviews,i,1);break;
    case 'rev-del':if(wasArmed===b.dataset.id){S.reviews=S.reviews.filter(function(x){return x.id!==b.dataset.id;});edRev=null;edFocus=null;}else armed=b.dataset.id;break;
    case 'rm-samples':if(wasArmed==='samples')S.reviews=S.reviews.filter(function(x){return !x.sample;});else armed='samples';break;
    case 'q-add':S.queue.push({kind:'film',title:'',creator:'',when:'',note:''});break;
    case 'q-del':S.queue.splice(i,1);break;
    case 'sc-add':S.scoring.rows.push({min:0,max:0,label:'',desc:''});break;
    case 'sc-del':S.scoring.rows.splice(i,1);break;
    case 'ln-add':S.links.push({label:'',url:''});break;
    case 'ln-del':S.links.splice(i,1);break;
    case 'ln-up':move(S.links,i,-1);break;
    case 'copy':copyData();re=false;break;
    case 'import':if(wasArmed==='import'){doImport();}else{armed='import';}break;
    case 'draft-restore':try{S=normalize(JSON.parse(readDraft()));setStatus('Restored your unpublished changes.','ok');}catch(err){setStatus('That saved draft could not be read.','warn');}break;
    case 'draft-drop':try{localStorage.removeItem(DRAFT_KEY);}catch(err){}break;
    case 'discard':if(wasArmed==='discard'){S=normalize(JSON.parse(PUBLISHED));try{localStorage.removeItem(DRAFT_KEY);}catch(err){}setStatus('Changes discarded.','ok');}else armed='discard';break;
    case 'publish':publish();return;
    default:re=false;
  }
  if(re){changed();renderEditor();}
});
function copyData(){
  var txt=JSON.stringify(S);
  var done=function(){setStatus('Site data copied. Paste it somewhere safe as a backup.','ok');};
  var fallback=function(){var ta=document.getElementById('imp');if(ta){ta.value=txt;ta.focus();ta.select();setStatus('Copying was blocked here, so the data is selected in the box below. Press Ctrl+C or ⌘C.','warn');}};
  try{navigator.clipboard.writeText(txt).then(done,fallback);}catch(err){fallback();}
}
function doImport(){
  var ta=document.getElementById('imp'),v=ta&&ta.value.trim();
  try{var d=JSON.parse(v);if(!d||!d.brand||!Array.isArray(d.reviews))throw 0;S=normalize(d);setStatus('Imported. Publish to make it live.','ok');}
  catch(err){setStatus('That text is not site data from the Backup tab. Copy it again and paste the whole block.','warn');}
}

/* ---------- publish ---------- */
function buildDoc(){
  var json=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
   '<title>'+esc(S.brand.name||'My channel')+'</title>\n<style id="app-css">'+CSS_SRC+'</style>\n<div id="site"></div>\n<div id="editor-root"></div>\n'+
   '<script type="application/json" id="site-data">'+json+'<\/script>\n<script id="app-js">'+JS_SRC+'<\/script></body></html>';
}
var publishing=false;
function publish(){
  if(publishing||!isDirty())return;
  if(!ART||!CAN_SAVE){setStatus(LOCAL?'Publishing works on the published page, not in this preview.':'This view is read-only, so changes cannot be published here.','warn');return;}
  var html=buildDoc();
  if(html.length>15.5*1024*1024){setStatus('The site is too large to save. Remove some uploaded images and try again.','warn');return;}
  publishing=true;setStatus('Publishing…');
  var draft=JSON.stringify(S);
  ART.publish(html).then(function(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}PUBLISHED=draft;setStatus('Published. Reloading the page…','ok');updateFoot();})
  .catch(function(err){
    publishing=false;try{localStorage.setItem(DRAFT_KEY,draft);}catch(e){}
    var c=err&&err.code;
    if(c==='conflict')setStatus('A newer version was published first. The page is reloading to it; your changes are saved in this browser and you can restore them.','warn');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){CAN_SAVE=false;setStatus('This view is read-only, so changes cannot be published here.','warn');}
    else if(c==='too_large')setStatus('The site is too large to save. Remove or replace some uploaded images.','warn');
    else if(c==='rate_limited')setStatus('Publishing too often. Wait a minute, then publish again.','warn');
    else setStatus('Publishing failed. Your changes are kept; try again in a moment.','warn');
  });
}
})();
</script></body></html>
